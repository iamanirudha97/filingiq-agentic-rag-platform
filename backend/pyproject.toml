[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "openai>=3.48.0",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.14.3",
    "pydantic-ai>=2.66.0",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2.1.8",
    "structlog>=26.1.0",
    "supabase>=2.34.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pyrefly]
python-interpreter = ".venv/bin/python"